name: Build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run e2e
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: e2e-screenshots
          path: e2e-screenshots
          if-no-files-found: ignore

  android:
    runs-on: ubuntu-latest
    needs: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: android-actions/setup-android@v3
      - run: npm install --no-audit --no-fund
      - run: npm run build
      - run: npx cap add android
      - run: node scripts/patch-android.mjs
      - name: App icon
        continue-on-error: true
        run: npx --yes @capacitor/assets generate --android --assetPath assets
      - run: npx cap sync android
      - name: Assemble debug APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon
      - run: cp android/app/build/outputs/apk/debug/app-debug.apk salahiyati.apk
      - uses: actions/upload-artifact@v4
        with:
          name: salahiyati-apk
          path: salahiyati.apk

  release:
    runs-on: ubuntu-latest
    needs: android
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: salahiyati-apk
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "v1.0.${{ github.run_number }}" salahiyati.apk \
            --repo "${{ github.repository }}" \
            --title "صلاحيتي v1.0.${{ github.run_number }}" \
            --notes "APK تجريبي (debug). ثبّته على أندرويد وفعّل التثبيت من مصادر غير معروفة."
